<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Εκδρομή" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#F7F3EE" />
<link rel="manifest" href="manifest.webmanifest" />

<link rel="icon" href="icon512.png" />

<title>Η σημερινή μας εκδρομή</title>
<style>
@font-face{font-family:'Serif';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,{{F_MD_GR}}) format('woff2');unicode-range:U+0370-03FF,U+1F00-1FFF;}
@font-face{font-family:'Serif';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,{{F_MD_LA}}) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122;}
@font-face{font-family:'Serif';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,{{F_IT_GR}}) format('woff2');unicode-range:U+0370-03FF,U+1F00-1FFF;}
@font-face{font-family:'Serif';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,{{F_IT_LA}}) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122;}
</style>
<style>{{LEAFLET_CSS}}</style>
<style>
:root{
  --bg:#F7F3EE; --card:#FFFFFF; --card2:#FBF8F5; --ink:#221B18; --muted:#8A7F78; --line:#ECE4DC;
  --accent:#A63D55; --accent-2:#7A2E45; --accent-soft:#F7E6E8; --gold:#B8864B;
  --ok:#2E8B57; --ok-soft:#E3F2E8; --warn:#B7791F; --warn-soft:#FBF0DA; --bad:#C0392B; --bad-soft:#FBE3E0;
  --blue:#2F7CF6; --shadow:0 1px 2px rgba(60,30,20,.05),0 8px 28px rgba(60,30,20,.08);
  --serif:'Serif','Iowan Old Style',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:22px;
}
html[data-theme="dark"]{
  --bg:#141011; --card:#1F191A; --card2:#241D1E; --ink:#F4ECE8; --muted:#A3968F; --line:#342A2B;
  --accent:#E07A90; --accent-2:#F29AAC; --accent-soft:#3A2228; --gold:#D9A765;
  --ok:#5CC98A; --ok-soft:#1D3326; --warn:#E6B14E; --warn-soft:#3A2F17; --bad:#F07A6A; --bad-soft:#3D1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.topbar{flex:none;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:var(--bg);z-index:5}
.topbar .ttl{flex:1;min-width:0}
.topbar .ttl b{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--muted);font-size:12.5px;margin-top:3px}
.topbar .chip{padding:3px 9px;font-size:10.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 130px;display:none}
.tab.on{display:block}
#tab-map{padding:0;overflow:hidden}
.tabbar{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:6}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:600}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:7;background:var(--ink);color:var(--bg);border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap;transition:transform .2s}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab.hide{display:none}

.clockrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 14px}
.clock{font-family:var(--serif);font-size:58px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clocklbl{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-bottom:6px}
.wx{background:var(--card);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);text-align:right;font-size:13px;line-height:1.3}
.wx b{font-size:17px}
.wx small{color:var(--muted);display:block}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.lbl{font-size:11.5px;letter-spacing:.16em;font-weight:800;color:var(--accent);text-transform:uppercase}
.lbl.mut{color:var(--muted)}
.now{padding:22px 20px 20px;position:relative;overflow:hidden}
.now .big{font-family:var(--serif);font-size:36px;line-height:1.08;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.01em}
.now .act{font-size:17px;color:var(--ink);opacity:.85}
.now .meta{color:var(--muted);font-size:13.5px;margin-top:10px}
.now.romantic{background:linear-gradient(160deg,var(--card) 0%,var(--accent-soft) 130%)}
.now.arrived{background:linear-gradient(160deg,var(--card) 10%,var(--ok-soft) 140%)}
.now .ribbon{position:absolute;right:-34px;top:20px;transform:rotate(35deg);background:var(--ok);color:#fff;font-size:10px;font-weight:800;letter-spacing:.14em;padding:4px 40px}
.stats{display:flex;gap:8px;margin:14px 0 4px}
.stat{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.next{display:flex;gap:14px;align-items:flex-start}
.next .em{font-size:30px;line-height:1;width:48px;height:48px;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.next .nm{font-family:var(--serif);font-size:23px;line-height:1.15}
.next .tm{font-size:14px;color:var(--muted);margin-top:2px}
.next .dist{font-size:15px;margin-top:8px;font-weight:600}
.next .eta{font-size:13.5px;color:var(--muted);margin-top:2px}
s{color:var(--muted);opacity:.8}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:18px;font-weight:800;font-size:16.5px;letter-spacing:.03em;text-decoration:none;transition:transform .15s,opacity .15s;text-align:center;padding:0 14px}
.btn:active{transform:scale(.98);opacity:.9}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(166,61,85,.3)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);min-height:48px}
.btn.sm{min-height:48px;font-size:14.5px;border-radius:15px}
.row{display:flex;gap:10px} .row>*{flex:1}
.mt{margin-top:12px} .mt2{margin-top:8px}
.banner{border-radius:18px;padding:13px 15px;margin-bottom:12px;font-size:14px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.banner>div{flex:1;min-width:0}
.banner b{display:block}
.banner.warn{background:var(--warn-soft);color:var(--ink)} .banner.bad{background:var(--bad-soft)} .banner.ok{background:var(--ok-soft)} .banner.info{background:var(--card);box-shadow:var(--shadow)} .banner.rom{background:var(--accent-soft)}
.newplan{margin-top:8px;font-variant-numeric:tabular-nums}
.newplan div{display:flex;gap:10px;padding:2px 0}
.newplan div b{width:48px;display:inline}

.mapwrap{height:210px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px;position:relative;background:var(--card2)}
.mapwrap .mm{position:absolute;inset:0}
.mapwrap .open{position:absolute;right:10px;bottom:10px;z-index:500;background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
#fullmap{position:absolute;inset:0}
.mapctl{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:500}
.mapcard .card{margin:0}
.darktiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.lowz .mkl:not(.keep){display:none}
.leaflet-container{background:var(--card2);font-family:var(--sans)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
html[data-theme="dark"] .leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#aaa}
html[data-theme="dark"] .leaflet-control-attribution a{color:#ccc}

.mk{position:relative;width:40px;height:40px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--card);border:2px solid var(--muted);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.mk span{transform:rotate(45deg);font-size:19px;line-height:1}
.mk.done{border-color:var(--ok);opacity:.75}
.mk.cur{border-color:var(--ok);background:var(--ok-soft)}
.mk.next{border-color:var(--accent);background:var(--accent);width:48px;height:48px;animation:pulse 2s infinite}
.mk.skip{opacity:.35;filter:grayscale(1)}
.mkl{position:absolute;left:20px;top:46px;transform:translateX(-50%);white-space:nowrap;background:var(--card);color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(166,61,85,.5)}70%{box-shadow:0 0 0 16px rgba(166,61,85,0)}100%{box-shadow:0 0 0 0 rgba(166,61,85,0)}}
.me{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;animation:mepulse 2s infinite}
@keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(47,124,246,.45)}70%{box-shadow:0 0 0 14px rgba(47,124,246,0)}100%{box-shadow:0 0 0 0 rgba(47,124,246,0)}}
.pl{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid var(--gold)}

.tl{position:relative}
.tli{display:flex;gap:12px;align-items:center;padding:9px 0;position:relative;width:100%;text-align:left}
.tli .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none;background:var(--card2);border:2px solid var(--line);color:var(--muted);z-index:1}
.tli.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tli.cur .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.tli.skip{opacity:.45} .tli.skip .nm{text-decoration:line-through}
.tli .t{width:50px;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.tli .t s{display:block;font-size:11px;font-weight:500}
.tli .nm{flex:1;font-size:15px}
.tli.cur .nm{font-weight:800}
.tli.done .nm,.tli.done .t{color:var(--muted)}
.tl:before{content:'';position:absolute;left:14px;top:22px;bottom:22px;width:2px;background:var(--line)}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .6s}
.progtxt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

.pc{padding:0;overflow:hidden}
.pc .hd{display:flex;gap:14px;padding:16px 16px 12px;align-items:center;width:100%;text-align:left}
.pc .em{font-size:26px;width:50px;height:50px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.pc .t{font-family:var(--serif);font-size:22px;font-variant-numeric:tabular-nums}
.pc .nm{font-weight:800;font-size:16px}
.pc .ac{color:var(--muted);font-size:13.5px;margin-top:2px}
.pc .bd{padding:0 16px 16px;font-size:14px;line-height:1.45}
.pc.done{opacity:.72} .pc.cur{box-shadow:0 0 0 2px var(--accent),var(--shadow)} .pc.skip{opacity:.5}
.note{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.tag{display:inline-block;font-size:11px;font-family:var(--sans);font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--muted);margin-left:8px;vertical-align:middle}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.sec-h{font-family:var(--serif);font-size:28px;margin:6px 2px 12px}
.sub{color:var(--muted);font-size:13.5px;margin:-6px 2px 14px;line-height:1.4}

.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:11px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.cat.on{background:var(--ink);color:var(--bg)}
.pli{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pli:last-child{border-bottom:0}
.pli .ic{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.pli .nm{font-weight:700;font-size:15px}
.pli .ds{color:var(--muted);font-size:12.5px;margin-top:2px}
.pli .km{margin-left:auto;font-weight:800;font-size:14px;white-space:nowrap}
.pli.cur .ic{background:var(--accent-soft)}

.set{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.set:last-child{border-bottom:0}
.set .k{flex:1;min-width:0} .set .k small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.set select,.set input[type=date],.set input[type=time],.set input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:170px}
.set input[type=text]{max-width:100%;width:100%;margin-top:8px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw i:before{content:'';position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:before{transform:translateX(20px)}
.build{text-align:center;color:var(--muted);font-size:11px;margin:18px 0}

#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(20,10,10,.38);opacity:0;transition:opacity .25s}
#sheet-root.open .sheet-bg{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet-root.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:26px;margin:4px 0 6px}
.sheet p{line-height:1.5;font-size:15.5px;margin:8px 0}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.sheet .opt span{width:30px;font-size:21px;text-align:center}
.say{white-space:pre-line;font-size:17px!important;line-height:1.55!important}

#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 64px);z-index:60;pointer-events:none;display:flex;justify-content:center}
#toast div{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-20px);opacity:0;transition:.3s;max-width:420px;text-align:center}
#toast.on div{transform:none;opacity:1}

#onb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:30px 26px calc(env(safe-area-inset-bottom) + 30px);overflow:auto}
#onb h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:38px;line-height:1.1;margin:0 0 10px}
#onb p{font-size:16.5px;line-height:1.55;color:var(--ink);opacity:.85;margin:0}
#onb .why{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;margin:18px 0 26px;font-size:15px;line-height:1.7}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.load{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.load:before{content:'';width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:14px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.45}
.rom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.rom-grid button{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 6px;font-size:13px;font-weight:700;line-height:1.35}
.rom-grid button b{display:block;font-size:22px;margin-bottom:2px}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="ttl"><b>❤️ Η σημερινή μας εκδρομή</b><small><span id="tb-sub"></span><span id="tb-status"></span></small></div>
    <button class="iconbtn" data-a="menu" aria-label="Μενού"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main>
    <section class="tab on" id="tab-trip">
      <div id="trip-a"></div>
      <div class="mapwrap" id="mini-wrap"><div class="mm" id="minimap"></div><button class="open" data-a="tab" data-tab="map">Χάρτης ↗</button></div>
      <div id="trip-b"></div>
    </section>
    <section class="tab" id="tab-map">
      <div id="fullmap"></div>
      <div class="mapctl">
        <button class="iconbtn" data-a="recenter" aria-label="Η θέση μου"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        <button class="iconbtn" data-a="fitall" aria-label="Όλες οι στάσεις"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>

// ---------------------------------------------------------------------------
// "Τι κάνουμε τώρα;"
// ---------------------------------------------------------------------------
function whatNowText(d, pr) {
  var t = d.t, lines = [];
  if (d.phase === 'pre') {
    var dep = pr[d.cur].pd, T = STOP_BY[d.target], ahead = daysBetween(dateStr(t), S.tripDate);
    if (ahead > 0) return 'Η εκδρομή είναι ' + prettyDate(S.tripDate) + ' ❤️\n\nΑναχώρηση ' + STOP_BY[d.cur].time + ' από ' + STOP_BY[d.cur].name + ', πρώτη στάση ' + T.name + ' στις ' + T.time + '.\n\nΘέλετε να τη δοκιμάσετε από πριν; Ρυθμίσεις → Λειτουργία δοκιμής.';
    if (dep > t) lines.push('Καλημέρα ❤️', '', 'Φεύγετε στις ' + hm(dep) + ' — σε ' + fmtMins((dep - t) / 60000) + '.');
    else lines.push('Είναι ώρα να ξεκινήσετε! 🚗', '', 'Πατήστε «ΞΕΚΙΝΑΜΕ» και η εφαρμογή αναλαμβάνει τα υπόλοιπα.');
    var L = legInfo(d.cur, d.target);
    lines.push('Πρώτη στάση: ' + T.name + ' ' + T.emoji + ' — περίπου ' + fmtDur(L.dur) + ' δρόμος.');
    var w = wxAt(d.target, pr[d.target].pa);
    if (w) lines.push('', 'Καιρός εκεί: ' + w.icon + ' ' + w.temp + '°C' + (w.rain >= 40 ? ', πιθανή βροχή — πάρτε ομπρέλα.' : '.'));
    return lines.join('\n');
  }
  if (d.phase === 'enroute') {
    var N = STOP_BY[d.target], lv = liveFor(d.target);
    lines.push((lv && lv.walk ? 'Περπατάτε' : 'Οδηγείτε') + ' προς ' + N.acc + ' ' + N.emoji);
    if (lv) lines.push('', 'Φτάνετε περίπου στις ' + hm(t + lv.duration * 1000) + ' (' + fmtDist(lv.distance) + ').');
    lines.push('', 'Χαλαρά — η εφαρμογή θα καταλάβει μόνη της πότε φτάσατε.');
    return lines.join('\n');
  }
  if (d.phase === 'done') return 'Τι ωραία μέρα ❤️\n\nΟλοκληρώσατε την εκδρομή. Καλή επιστροφή — και οδηγείτε προσεκτικά.';
  var C = STOP_BY[d.cur];
  lines.push('Είστε ' + C.at + ' ❤️');
  if (d.target) {
    var N2 = STOP_BY[d.target], left = (pr[d.target].pa - t) / 60000, leave = (pr[d.cur].pd - t) / 60000;
    lines.push('');
    if (leave > 10) lines.push('Έχετε περίπου ' + fmtMins(left) + ' μέχρι ' + (N2.id === 'lunch' ? 'το φαγητό' : N2.acc) + '.');
    else if (leave > 0) lines.push('Σε ' + fmtMins(leave) + ' καλό είναι να ξεκινάτε για ' + N2.acc + '.');
    else lines.push('Ώρα να ξεκινάτε για ' + N2.acc + ' — πατήστε «ΠΑΜΕ ΕΚΕΙ».');
    if (leave > 10 && C.tip) lines.push('', C.tip);
    if (C.id === 'lunch' && leave <= 15 && leave > 0) lines.push('', 'Ζητήστε σιγά-σιγά τον λογαριασμό.');
    lines.push('', 'Επόμενη στάση:', N2.name + ' — ' + hm(pr[d.target].pa));
  } else {
    if (C.tip) lines.push('', C.tip);
    var ss = sunsetMs();
    if (ss && ss > t) lines.push('', '🌅 Ηλιοβασίλεμα στις ' + hm(ss) + (ss - t < 90 * 60000 ? ' — βρείτε μια θέση με θέα στη θάλασσα.' : '.'));
    if (C.romantic) lines.push('', 'Για ένα ποτό ή ένα ήσυχο σημείο: «❤️ ΒΡΕΣ ΚΑΤΙ ΡΟΜΑΝΤΙΚΟ».');
  }
  var w2 = wxAt(d.cur, t);
  if (w2 && w2.rain >= 50) lines.push('', '☔ Πιθανή βροχή (' + w2.rain + '%) — καλό είναι να έχετε κι ένα σχέδιο για κλειστό χώρο.');
  return lines.join('\n');
}

function openSheet(html) {
  var r = document.getElementById('sheet-root');

  void r.offsetWidth;

}
function closeSheet() {
  var r = document.getElementById('sheet-root');
  r.classList.remove('open');
  ui.whatnowOpen = false;
  setTimeout(function () { if (!r.classList.contains('open')) r.innerHTML = ''; }, 320);
}
function confirmSheet(title, text, okLabel, okAction, okData) {
  openSheet('<h3>' + title + '</h3><p>' + text + '</p><div class="row mt"><button class="btn sec" data-a="close">ΑΚΥΡΟ</button><button class="btn pri" data-a="' + okAction + '" ' + (okData || '') + '>' + okLabel + '</button></div>');
}
function stopSheet(id) {
  var d = derive(), pr = project(d), s = STOP_BY[id], x = st(id), cp = curPos();
  var i = S.order.indexOf(id), w = pr[id] && i > 0 ? wxAt(id, pr[id].pa) : null;
  var walk = cp ? hv(cp, s) < WALK : false;
  var h = '<div style="font-size:34px">' + s.emoji + '</div><h3>' + esc(s.name) + '</h3>' +
    '<div class="hint" style="font-size:14px">' + (x.skipped ? s.time + ' · παραλείπεται' : timeCell(pr, id)) + ' · ' + esc(actLine(s)) + (s.dur ? ' · ~' + fmtMins(s.dur + (x.extra || 0)) : '') + '</div>' +
    '<p style="font-size:14px">' + esc(s.address) + (s.plus ? '<br>Plus Code: ' + s.plus : '') + '</p>' +
    (cp ? '<p style="font-size:14px">📍 ' + fmtDist(hv(cp, s)) + ' από εσάς (ευθεία)</p>' : '') +
    (w ? '<p style="font-size:14px">' + w.icon + ' ' + w.temp + '°C ' + w.text + ' · ☔ ' + w.rain + '% · 💨 ' + w.wind + ' km/h (' + w.hour + ')</p>' : '') +
    (s.info ? '<div class="banner info" style="font-size:13.5px"><div>' + esc(s.info) + '</div></div>' : '') +
    (s.warn ? '<div class="banner warn" style="font-size:13.5px"><div>⚠️ ' + esc(s.warn) + '</div></div>' : '');
  if (i > 0 && !x.arrivedAt && !x.skipped) h += '<button class="btn pri mt" data-a="go" data-id="' + id + '">🧭 ΠΑΜΕ ΕΚΕΙ</button>';
  h += '<div class="mt2">' + navBtn(s, 'sec', null, walk) + '</div>';
  h += '<div class="row mt2"><button class="btn sm sec" data-a="nearby" data-cat="parking" data-ref="' + id + '">🅿️ Βρες parking</button><button class="btn sm sec" data-a="nearby" data-cat="photo" data-ref="' + id + '">📸 Photo spots</button></div>';
  if (s.phone || s.cid) h += '<div class="row mt2">' + (s.phone ? '<a class="btn sm sec" href="tel:' + s.phone + '">📞 Κλήση</a>' : '') + (s.cid ? '<a class="btn sm sec" href="https://maps.google.com/?cid=' + s.cid + '" target="_blank" rel="noopener">⭐ Κριτικές</a>' : '') + '</div>';
  if (i > 0) {

  }
  openSheet(h);
}
function placeSheet(it) {

function menuSheet() {

  var h = '<h3>Χρειάζομαι αλλαγή</h3>' +

    o('nearby', '🍴', 'Βρες φαγητό', 'data-cat="food"') +
    o('nearby', '🅿️', 'Βρες parking', 'data-cat="parking"') +
    o('nearby', '⛽', 'Βρες βενζινάδικο', 'data-cat="fuel"') +

function addExtra(min) {
  var d = derive();
  var id = d.phase === 'pre' || d.phase === 'at' ? d.cur : null;
  if (!id) { toast('Η ώρα άφιξης υπολογίζεται ζωντανά από το GPS 👍'); return; }
  var x = st(id);
  x.extra = (x.extra || 0) + min;
  save();
  toast(d.phase === 'pre' ? 'Αναχώρηση +' + min + ' λεπτά — το πρόγραμμα προσαρμόστηκε' : '+' + min + ' λεπτά ' + (id === 'lunch' ? 'στο φαγητό' : 'εδώ') + ' — οι επόμενες στάσεις μετακινήθηκαν');
  render(true);
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
var ACT = {
  tab: function (el) { closeSheet(); showTab(el.dataset.tab); },
  close: closeSheet,
  menu: menuSheet,
  whatnow: function () {
    var d = derive();
    openSheet('<div class="lbl">✨ ΤΙ ΚΑΝΟΥΜΕ ΤΩΡΑ;</div><p class="say" id="whatnow-body">' + esc(whatNowText(d, project(d))) + '</p><button class="btn sec mt" data-a="close">OK ❤️</button>');
    ui.whatnowOpen = true;
    lastHtml['whatnow-body'] = null;
  },
  start: function () {
    var t = now();
    if (S.tripDate !== dateStr(t)) {
      confirmSheet('Ξεκινάμε σήμερα;', 'Η εκδρομή είναι ορισμένη για ' + esc(prettyDate(S.tripDate)) + '. Να ξεκινήσει σήμερα, ' + esc(prettyDate(dateStr(t))) + ';', '🚗 ΞΕΚΙΝΑΜΕ', 'startnow');
      return;
    }
    startTrip();
  },
  startnow: function () { closeSheet(); startTrip(); },
  startat: function (el) { startTrip(el.dataset.id); },
  go: function (el) {
    var id = el.dataset.id, d = derive();
    closeSheet();
    if (!S.started) {
      if (S.tripDate !== dateStr(now())) { ACT.start(); return; }
      startTrip();
      d = derive();
    }
    if (d.target !== id) {
      // heading somewhere other than the scheduled next stop: it becomes next
      var ord = S.order;
      ord.splice(ord.indexOf(id), 1);
      ord.splice(ord.indexOf(d.cur) + 1, 0, id);
      st(id).skipped = false;
      save(); fetchLegs(true);
      d = derive();
    }
    if (d.phase === 'at') markDeparted(d.cur);
    save();
    requestWake();
    route.live = null;
    showTab('trip');
    maybeRoute(true);
    render(true);
    updateMaps();
    fitMini(true);
  },
  arrived: function (el) {
    var d = derive();
    if (d.phase === 'at') markDeparted(d.cur);
    markArrived(el.dataset.id, 'manual');
  },
  arrivejump: function (el) {
    var id = el.dataset.id, d = derive();
    closeSheet();
    if (!S.started) { startTrip(id); return; }
    var ord = activeOrder(), i = ord.indexOf(id);
    ord.slice(d.visited, i).forEach(function (b) { st(b).skipped = true; });
    if (d.cur) markDeparted(d.cur);
    fetchLegs(true);
    markArrived(id, 'manual');
  },
  dismiss: function (el) { S.dismissed = el.dataset.id; save(); render(true); },
  extend: function (el) { closeSheet(); addExtra(+el.dataset.min); },
  delay: function () {
    var d = derive();
    if (d.phase === 'enroute') {
      openSheet('<h3>Καθυστέρησα</h3><p>Καθ\' οδόν η ώρα άφιξης υπολογίζεται ζωντανά από το GPS, οπότε οι επόμενες στάσεις ήδη προσαρμόζονται μόνες τους.</p><button class="btn sec mt" data-a="close">OK</button>');
      return;
    }
    openSheet('<h3>' + (d.phase === 'pre' ? 'Θα φύγουμε αργότερα' : 'Καθυστερήσαμε') + '</h3><p>Πόσο; Οι επόμενες στάσεις θα μετακινηθούν αυτόματα.</p>' +
      '<div class="row mt"><button class="btn sec" data-a="extend" data-min="15">+15′</button><button class="btn sec" data-a="extend" data-min="30">+30′</button><button class="btn sec" data-a="extend" data-min="60">+1 ώρα</button></div>');
  },
  stay: function () {
    openSheet('<h3>Μένουμε περισσότερο</h3><p>Οι επόμενες στάσεις θα μετακινηθούν ανάλογα.</p><div class="row mt"><button class="btn sec" data-a="extend" data-min="15">+15′</button><button class="btn pri" data-a="extend" data-min="30">+30′</button><button class="btn sec" data-a="extend" data-min="60">+1 ώρα</button></div>');
  },
  skipask: function (el) {
    var id = el.dataset.id || derive().target;

    confirmSheet('Παράλειψη στάσης', 'Θέλετε να παραλείψετε ' + esc(STOP_BY[id].acc) + ';', 'ΠΑΡΑΛΕΙΨΗ', 'skip', 'data-id="' + id + '"');
  },
  skip: function (el) {

    save(); closeSheet();
    route.live = null;
    fetchLegs(true); maybeRoute(true);

  },
  unskip: function (el) { st(el.dataset.id).skipped = false; save(); closeSheet(); fetchLegs(true); render(true); updateMaps(); },
  changedest: function () {

    rest.forEach(function (id) { var s = STOP_BY[id]; h += '<button class="opt" data-a="go" data-id="' + id + '"><span>' + s.emoji + '</span>' + esc(s.name) + (id === d.target ? ' <span class="tag acc">ΕΠΟΜΕΝΗ</span>' : '') + '</button>'; });
    openSheet(h);
  },
  nearby: function (el) {

  place: function (el) { var it = ui.lastPlaces[+el.dataset.i]; if (it) placeSheet(it); },

  },
  nearmap: function () { showTab('map'); showNearbyOnMap(null); },
  stop: function (el) { stopSheet(el.dataset.id); },
  finishask: function () { confirmSheet('Τέλος ημέρας;', 'Να κλείσει η εκδρομή; ❤️', 'ΤΕΛΟΣ', 'finish'); },
  finish: function () { var d = derive(); markDeparted(d.cur); S.finished = now(); save(); releaseWake(); closeSheet(); render(true); updateMaps(); },
  retryroute: function () { route.err = null; maybeRoute(true); render(true); },
  allowgeo: function () {
    if (geo.watch != null) { try { navigator.geolocation.clearWatch(geo.watch); } catch (e) {} }
    geo.watch = null; S.geoAsked = true; save();
    startGeo(); render(true);
  },
  recenter: function () {
    var p = curPos(), M = MAPS.full;
    if (p && M) M.m.setView([p.lat, p.lng], Math.max(M.m.getZoom(), 15));
    else toast('Βρίσκουμε πού είστε…');
  },
  fitall: function () { fitAll(MAPS.full); },
  resetask: function () { confirmSheet('Επαναφορά εκδρομής;', 'Θα σβηστεί η πρόοδος της ημέρας (αφίξεις, παραλείψεις, καθυστερήσεις). Οι ρυθμίσεις μένουν.', 'RESET', 'reset'); },
  reset: function () {
    S.started = null; S.finished = null; S.stops = {}; S.notified = {}; S.arrival = null; S.dismissed = null;
    S.order = STOPS.map(function (s) { return s.id; });
    save(); closeSheet(); releaseWake(); route.live = null; fetchLegs(true);
    toast('Η εκδρομή επανήλθε'); showTab('trip');
  },
  simadd: function (el) { S.sim.offset += (+el.dataset.min) * 60000; save(); tick(true); render(true); },
  onbok: function () {
    S.onboarded = true; S.geoAsked = true; save();
    var o = document.getElementById('onb'); if (o) o.remove();
    startGeo(); render(true);
  },
  onbskip: function () { S.onboarded = true; save(); var o = document.getElementById('onb'); if (o) o.remove(); render(true); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el) return;
  var f = ACT[el.dataset.a];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('change', function (e) {
  var el = e.target, k = el.dataset && el.dataset.set;
  if (!k) return;
  var v = el.type === 'checkbox' ? el.checked : el.value;
  if (k === 'tripDate') {
    if (!v) return;
    S.tripDate = v; wx = null; S.notified = {}; fetchWeather(true);
  } else if (k === 'notif') {
    if (v && !('Notification' in window)) { toast('Στο iPhone: πρώτα «Προσθήκη στην οθόνη Αφετηρίας»'); el.checked = false; return; }
    if (v && Notification.permission !== 'granted') {
      Notification.requestPermission().then(function (p) { S.settings.notif = p === 'granted'; save(); render(true); if (p === 'granted') toast('🔔 Οι ειδοποιήσεις ενεργοποιήθηκαν'); });
      return;
    }
    S.settings.notif = v;
  } else if (k === 'sim.on') {
    S.sim.on = v;
    if (!v) S.sim.offset = 0;
  } else if (k === 'sim.time') {
    if (!v) return;
    S.sim.offset = athensMs(S.tripDate, v) - Date.now();
  } else if (k === 'sim.loc') {
    S.sim.loc = v && STOP_BY[v] ? { lat: STOP_BY[v].lat, lng: STOP_BY[v].lng, id: v } : (v === 'custom' ? S.sim.loc : null);
  } else if (k === 'sim.tap') {
    S.sim.tap = v;
  } else if (k in S.settings) {
    S.settings[k] = v;
    if (k === 'weather' && v) fetchWeather(true);
    if (k === 'wake') { if (v) requestWake(); else releaseWake(); }
    if (k === 'token') { route.live = null; maybeRoute(true); }
  }
  save();
  if (k.indexOf('sim.') === 0) { hits.arrive = hits.depart = 0; route.live = null; detect(); maybeRoute(true); }
  render(true); updateMaps(true);
});

function showTab(t) {
  ui.tab = t;
  ['trip', 'map', 'plan', 'nearby', 'settings'].forEach(function (x) {
    document.getElementById('tab-' + x).classList.toggle('on', x === t);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) { b.classList.toggle('on', b.dataset.tab === t); });
  document.getElementById('tab-' + t).scrollTop = 0;
  render(true);
  setTimeout(function () {
    if (t === 'map') { var M = ensureMap('full'); M.m.invalidateSize(); if (!M.fitted) { fitAll(M); M.fitted = true; } }
    if (t === 'trip' && MAPS.mini) MAPS.mini.m.invalidateSize();
    updateMaps(true);
  }, 30);
}

// ---------------------------------------------------------------------------
// Maps (Leaflet)
// ---------------------------------------------------------------------------
var MAPS = {};
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function applyTheme() {
  var t = S.settings.theme, dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var want = dark ? 'dark' : 'light';
  if (document.documentElement.getAttribute('data-theme') !== want) {
    document.documentElement.setAttribute('data-theme', want);
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#141011' : '#F7F3EE');
  }
}
function tileDef() {
  var dark = isDark(), tk = token(), p = S.settings.map;
  if (p === 'mapbox' && tk) return { url: 'https://api.mapbox.com/styles/v1/mapbox/' + (dark ? 'dark-v11' : 'streets-v12') + '/tiles/256/{z}/{x}/{y}@2x?access_token=' + tk, o: { attribution: '© Mapbox © OpenStreetMap', maxZoom: 20 } };
  if (p === 'esri') return { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', o: { attribution: '© Esri', maxZoom: 19, className: dark ? 'darktiles' : '' } };
  return { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', o: { attribution: '© OpenStreetMap', maxZoom: 19, className: dark ? 'darktiles' : '' } };
}
function ensureMap(key) {
  if (MAPS[key]) return MAPS[key];
  var el = document.getElementById(key === 'mini' ? 'minimap' : 'fullmap');
  var m = L.map(el, { zoomControl: false, attributionControl: true, dragging: key === 'full' || !L.Browser.mobile, scrollWheelZoom: key === 'full', tap: false });
  m.setView([37.88, 23.2], 9);
  var M = { m: m, key: key, markers: {}, nearby: L.layerGroup().addTo(m) };
  m.attributionControl.setPrefix('');
  var lowz = function () { el.classList.toggle('lowz', m.getZoom() < 14); };
  m.on('zoomend', lowz); lowz();
  if (key === 'mini') m.on('click', function () { showTab('map'); });
  else m.on('click', function (e) {
    if (S.sim.on && S.sim.tap) {
      S.sim.loc = { lat: e.latlng.lat, lng: e.latlng.lng };
      save(); hits.arrive = hits.depart = 0; detect(); maybeRoute(true); render(true); updateMaps(true);
    }
  });
  MAPS[key] = M;
  updateMaps(true);
  return M;
}
function stopIcon(id, cls, label) {
  var s = STOP_BY[id], big = cls === 'next', sz = big ? 48 : 40;
  return L.divIcon({ className: '', iconSize: [sz, sz], iconAnchor: [sz / 2, sz + 4], html: '<div class="mk ' + cls + '"><span>' + s.emoji + '</span></div>' + (label ? '<div class="mkl' + (big ? ' keep' : '') + '" style="left:' + sz / 2 + 'px;top:' + (sz + 8) + 'px">' + esc(label) + '</div>' : '') });
}
function updateMaps(force) {
  var d = derive();
  ['mini', 'full'].forEach(function (k) {
    var M = MAPS[k];
    if (!M) return;
    if (k === 'full' && ui.tab !== 'map' && !force) return;
    var td = tileDef();
    var tkey = td.url + (td.o.className || '');
    if (M.tileUrl !== tkey) {
      if (M.tiles) M.m.removeLayer(M.tiles);
      M.tiles = L.tileLayer(td.url, td.o).addTo(M.m);
      M.tileUrl = tkey;
    }
    // full itinerary (faint dashed) + live route to the next stop (bold)
    var lg = legs && legs.key === activeOrder().join('|') ? legs.geom : null;
    if (lg && M.legsKey !== legs.at) {
      if (M.legs) M.m.removeLayer(M.legs);
      M.legs = L.polyline(lg, { color: '#A63D55', weight: 3, opacity: .35, dashArray: '6 8', interactive: false }).addTo(M.m);
      M.legsKey = legs.at;
    } else if (!lg && M.legs) { M.m.removeLayer(M.legs); M.legs = null; M.legsKey = null; }
    var lv = d.target && d.phase !== 'done' ? liveFor(d.target) : null;
    var rk = lv ? lv.at + ':' + lv.to : '';
    if (M.routeKey !== rk) {
      if (M.route) M.m.removeLayer(M.route);
      M.route = lv ? L.polyline(lv.geometry, { color: isDark() ? '#E07A90' : '#A63D55', weight: 6, opacity: .9, dashArray: lv.walk ? '2 10' : null, lineCap: 'round', interactive: false }).addTo(M.m) : null;
      M.routeKey = rk;
    }
    S.order.forEach(function (id) {
      var x = st(id), cls = x.skipped ? 'skip' : x.arrivedAt ? (id === d.cur && d.phase === 'at' ? 'cur' : 'done') : id === d.target ? 'next' : '';
      var label = k === 'full' || cls === 'next' ? STOP_BY[id].name : '';
      var sig = cls + '|' + label;
      if (!M.markers[id]) {
        M.markers[id] = L.marker([STOP_BY[id].lat, STOP_BY[id].lng], { icon: stopIcon(id, cls, label), zIndexOffset: cls === 'next' ? 1000 : 0 }).addTo(M.m);
        M.markers[id].on('click', function () { if (k === 'mini') showTab('map'); else stopSheet(id); });
        M.markers[id]._sig = sig;
      } else if (M.markers[id]._sig !== sig) {
        M.markers[id].setIcon(stopIcon(id, cls, label));
        M.markers[id].setZIndexOffset(cls === 'next' ? 1000 : 0);
        M.markers[id]._sig = sig;
      }
    });
    var p = curPos();
    if (p) {
      if (!M.me) {
        M.acc = L.circle([p.lat, p.lng], { radius: p.acc, color: '#2F7CF6', weight: 1, opacity: .3, fillOpacity: .08, interactive: false }).addTo(M.m);
        M.me = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', iconSize: [20, 20], iconAnchor: [10, 10], html: '<div class="me"></div>' }), zIndexOffset: 2000, interactive: false }).addTo(M.m);
      } else { M.me.setLatLng([p.lat, p.lng]); M.acc.setLatLng([p.lat, p.lng]).setRadius(p.acc); }
    } else if (M.me) { M.m.removeLayer(M.me); M.m.removeLayer(M.acc); M.me = M.acc = null; }
  });
  fitMini(false);
}
function fitMini(force) {
  var M = MAPS.mini;
  if (!M) return;
  var d = derive(), p = curPos();
  var sig = d.phase + ':' + (d.target || d.cur) + ':' + (p ? Math.round(p.lat * 100) + ',' + Math.round(p.lng * 100) : '');
  if (!force && M.fitSig === sig) return;
  M.fitSig = sig;
  var pts = [], id = d.target || d.cur;
  if (id) pts.push([STOP_BY[id].lat, STOP_BY[id].lng]);
  if (p) pts.push([p.lat, p.lng]);
  else if (d.cur && d.cur !== id) pts.push([STOP_BY[d.cur].lat, STOP_BY[d.cur].lng]);
  if (pts.length === 1 || (pts.length === 2 && hv({ lat: pts[0][0], lng: pts[0][1] }, { lat: pts[1][0], lng: pts[1][1] }) < 150)) M.m.setView(pts[0], 16);
  else if (pts.length > 1) M.m.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
}
function fitAll(M) {
  if (!M) return;
  var pts = STOPS.map(function (s) { return [s.lat, s.lng]; });
  var p = curPos();
  if (p) pts.push([p.lat, p.lng]);
  M.m.fitBounds(pts, { padding: [40, 40] });
}
function showNearbyOnMap(focus) {
  setTimeout(function () {
    var M = ensureMap('full');
    M.nearby.clearLayers();
    var C = CAT_BY[ui.near.cat], pts = [];
    (ui.lastPlaces || []).forEach(function (it) {
      var mk = L.marker([it.lat, it.lng], { icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15], html: '<div class="pl">' + (it.icon || C.icon) + '</div>' }) }).addTo(M.nearby);
      mk.on('click', function () { placeSheet(it); });
      pts.push([it.lat, it.lng]);
    });
    M.m.invalidateSize();
    M.fitted = true;
    if (focus) M.m.setView([focus.lat, focus.lng], 17);
    else if (pts.length) { var p = curPos(); if (p) pts.push([p.lat, p.lng]); M.m.fitBounds(pts, { padding: [50, 50], maxZoom: 16 }); }
  }, 80);
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
var tickN = 0;
function tick(forceSlow) {
  var c = document.getElementById('clock');
  if (c) c.textContent = hm(now());
  tickN++;
  if (forceSlow || tickN % 5 === 0) {
    // re-check with the last fix too: a phone standing still may not send a
    // second GPS update, and arrival needs two consecutive hits
    var cp = curPos();
    if (cp && Date.now() - cp.at < 120000) detect();
    var d = derive(), pr = project(d);
    checkNotifs(d, pr);
    maybeRoute(false);
    render();
    updateMaps();
  }
  if (tickN % 600 === 0) { fetchWeather(false); fetchLegs(false); }
}
window.addEventListener('online', function () { online = true; fetchLegs(false); fetchWeather(false); maybeRoute(true); render(true); });
window.addEventListener('offline', function () { online = false; render(true); });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { requestWake(); tick(true); maybeRoute(true); }
});
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { render(true); updateMaps(true); }); } catch (e) {} }

function onboarding() {
  if (S.onboarded) return;
  var div = document.createElement('div');
  div.id = 'onb';
  div.innerHTML = '<div style="font-size:44px;margin-bottom:10px">❤️</div><h1>Η σημερινή μας εκδρομή</h1>' +
    '<p>Στεφάνι · Αρχαία Κόρινθος · Λουτράκι</p>' +
    '<div class="why"><b>Θέλουμε την τοποθεσία σας για να σας δείχνουμε πού βρίσκεστε και ποιο είναι το επόμενο σημείο.</b><br>' +
    '📍 πού είστε τώρα<br>🧭 πόσο απέχει η επόμενη στάση<br>⏱️ τι ώρα θα φτάσετε<br>🎉 πότε φτάσατε — αυτόματα<br>' +
    '<span class="hint">Η θέση σας μένει μόνο στο κινητό σας.</span></div>' +
    '<button class="btn pri" data-a="onbok">ΕΠΙΤΡΕΠΩ</button><button class="btn ghost mt2" data-a="onbskip">Όχι τώρα</button>';
  document.body.appendChild(div);
}

(function init() {
  var lp = store.get('trip.lastpos', null);
  if (lp && Date.now() - lp.at < 10 * 60000) pos = lp;
  applyTheme();
  ensureMap('mini');
  render(true);
  onboarding();
  initGeo();
  fetchLegs(false);
  fetchWeather(false);
  if (S.started && !S.finished) requestWake();
  setInterval(tick, 1000);
  setTimeout(function () { if (MAPS.mini) MAPS.mini.m.invalidateSize(); fitMini(true); }, 200);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js?v={{BUILD_VERSION}}').then(function (reg) { reg.update(); }).catch(function () {});
    var refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
      navigator.serviceWorker.getRegistration().then(function (reg) { if (reg) reg.update(); });
    }
  });
}
</script>
